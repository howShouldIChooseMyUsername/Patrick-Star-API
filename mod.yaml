schema: 1
product: fabric/api
mod:
  id: patrick_star_api
  version: "1.0.0+26.3"
  group: comvyne.patrickstar
  archivesName: patrick-star-api
  name: Patrick Star API
  description: Arbitrates waypoint navigation requests from multiple Fabric mods on the same mob.
  environment: "*"
  entrypoints:
    main:
      - comvyne.patrickstar.internal.PatrickStarMod
  depends:
    fabricloader: ">=0.20.1"
    fabric-api: ">=0.166.2"
minecraft:
  version: "26.3"
  mappings: mojang
  loader: "0.20.1"
  fabricApi: "0.166.2+26.3"
settings:
  java:
    release: 25
    sourcesJar: true
  kotlin:
    enabled: false
  resources:
    failOnExistingFabricModJson: true
repositories:
  - fabric
  - mavenCentral
test-dependencies:
  - "org.junit.jupiter:junit-jupiter:6.0.0"
